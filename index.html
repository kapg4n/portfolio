<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="Creative studio: brand identity, packaging and art direction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Familjen+Grotesk:wght@500;700&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#works">Skip to work</a>

  <header class="site-header" id="site-header">
    <a class="site-header__logo" href="#top" data-bind="name"></a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="#top">Home</a>
      <a href="#works">Works</a>
      <a href="#about">About</a>
      <a class="site-header__cta site-header__cta--in-nav" href="#contact">Contact</a>
    </nav>
    <a class="site-header__cta" href="#contact">Contact</a>
  </header>

  <section class="intro" id="top" aria-label="Recalibrated, creative studio">
    <h1 class="intro__mark"><span class="intro__co">CO:</span><br><span class="intro__word" id="intro-word" data-final="Recalibrated">Recalibrated</span><span class="intro__star">*</span></h1>
    <div class="intro__def">
      <p class="intro__ipa">*/riːkˈæl.ɪ.breɪt./</p>
      <p class="intro__gloss">to change the way you do or think about something.</p>
    </div>
    <div class="intro__bottom">
      <a class="intro__scroll" href="#works" aria-label="Scroll to work"><span>Scroll</span></a>
      <p class="intro__tag">creative studio</p>
    </div>
  </section>

  <div class="page" id="page">
  <main>
    <section class="featured" id="featured" aria-labelledby="featured-h" hidden>
      <div class="featured__media" id="featured-media"></div>
      <div class="featured__meta">
        <p class="featured__label">Featured project</p>
        <h2 class="featured__title" id="featured-h"></h2>
        <p class="featured__facts" id="featured-facts"></p>
        <a class="featured__link" id="featured-link" href="#">View project</a>
      </div>
    </section>

    <section class="works" id="works" aria-labelledby="works-h">
      <div class="works__head">
        <h2 id="works-h">Selected Works</h2>
      </div>
      <ul class="works__grid" id="works-list"></ul>
    </section>

    <section class="services" id="services" aria-labelledby="services-h">
      <h2 id="services-h" class="services__label">Services</h2>
      <dl class="services__list" id="services-list"></dl>
    </section>

    <section class="about" id="about" aria-labelledby="about-h">
      <div class="about__portrait" id="portrait" role="img"></div>
      <div class="about__text">
        <h2 id="about-h">About</h2>
        <div id="about-body"></div>
        <p class="about__clients-label">Selected clients</p>
        <p class="about__clients" id="clients"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <h2 class="site-footer__title">Get in touch</h2>
    <a class="site-footer__mail" id="mail"></a>
    <p class="site-footer__socials" id="socials"></p>
    <div class="site-footer__meta">
      <p>&copy; <span id="year"></span> <span data-bind="name"></span></p>
      <a href="#top">Back to top</a>
    </div>
  </footer>
  </div>

  <div class="project" id="project" role="dialog" aria-modal="true" aria-labelledby="project-title" hidden>
    <div class="project__inner">
      <button class="project__close" id="project-close" type="button">Close</button>
      <header class="project__head">
        <h2 class="project__title" id="project-title"></h2>
        <dl class="project__facts" id="project-facts"></dl>
      </header>
      <p class="project__summary" id="project-summary"></p>
      <div class="project__gallery" id="project-gallery"></div>
      <nav class="project__next" id="project-next" aria-label="Next project"></nav>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
